<!DOCTYPE html>
<html lang="kaa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandı Tap!</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #03020d;
      --panel: rgba(10, 10, 22, 0.65);
      --border: #23233a;
      --accent: #f0e040;
      --accent2: #40e0f0;
      --danger: #f04060;
      --success: #40f080;
      --text: #e8e8f0;
      --muted: #6b6b94;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: 20px 0;
      position: relative;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background: 
        radial-gradient(circle at 80% 20%, rgba(40, 30, 90, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 20% 70%, rgba(20, 40, 100, 0.35) 0%, transparent 60%),
        linear-gradient(rgba(64,224,240,0.01) 1px, transparent 1px),
        linear-gradient(90deg, rgba(64,224,240,0.01) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
      z-index: 1;
    }

    body::after {
      background-image: 
        radial-gradient(circle at 50% 50%, #fff, rgba(255,255,255,0.2) 1px, transparent 20px),
        radial-gradient(circle at 30% 20%, #fff, rgba(255,255,255,0.15) 1.5px, transparent 30px),
        radial-gradient(circle at 70% 80%, #fff, rgba(200,220,255,0.1) 2px, transparent 40px),
        radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 5px),
        radial-gradient(rgba(200,220,255,0.8), rgba(255,255,255,.1) 1px, transparent 8px);
      
      background-size: 450px 450px, 350px 350px, 550px 550px, 150px 150px, 250px 250px;
      background-position: 0 0, 120px 150px, 350px 80px, 40px 60px, 90px 10px;
      animation: spaceTwinkle 8s ease-in-out infinite alternate;
      z-index: 0;
      opacity: 0.75;
    }

    @keyframes spaceTwinkle {
      0% { opacity: 0.6; transform: scale(0.97) rotate(0deg); }
      50% { opacity: 0.9; }
      100% { opacity: 0.65; transform: scale(1.03) rotate(0.5deg); }
    }

    .container {
      position: relative;
      width: min(480px, 95vw);
      z-index: 2;
    }

    .header { text-align: center; margin-bottom: 24px; }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 12vw, 80px);
      letter-spacing: 4px;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 2px 15px rgba(64,224,240,0.3));
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
    }

    .lang-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 16px;
    }

    .lang-btn {
      padding: 4px 10px;
      background: rgba(18, 18, 26, 0.4);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s;
      backdrop-filter: blur(4px);
    }

    .lang-btn:hover { border-color: var(--accent2); color: var(--accent2); }
    .lang-btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(64,224,240,0.08); }

    .mode-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mode-btn {
      flex: 1;
      padding: 8px;
      background: rgba(18, 18, 26, 0.4);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s;
      backdrop-filter: blur(4px);
    }
    .mode-btn:hover { border-color: var(--accent2); color: var(--accent2); }
    .mode-btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(64,224,240,0.08); }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 24px;
      position: relative;
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .difficulty-row { display: flex; gap: 8px; margin-bottom: 20px; }

    .diff-btn {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s;
    }

    .diff-btn:hover { border-color: var(--accent); color: var(--accent); }
    .diff-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(240,224,64,0.08); }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      text-align: center;
      padding: 12px 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 2px;
    }

    .stat-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--accent2);
      line-height: 1;
    }

    .stat-label {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    .range-info {
      text-align: center;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .range-info span { color: var(--accent); font-size: 13px; }

    .input-row { display: flex; gap: 10px; margin-bottom: 16px; }

    .guess-input {
      flex: 1;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 4px;
      text-align: center;
      padding: 8px 16px;
      outline: none;
      transition: border-color 0.15s;
      -moz-appearance: textfield;
    }

    .guess-input::-webkit-inner-spin-button,
    .guess-input::-webkit-outer-spin-button { -webkit-appearance: none; }

    .guess-input:focus { border-color: var(--accent); }
    .guess-input:disabled { opacity: 0.3; cursor: not-allowed; }

    .guess-btn {
      padding: 0 24px;
      background: var(--accent);
      border: none;
      border-radius: 2px;
      color: #0a0a0f;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .guess-btn:hover { background: #fff060; transform: translateY(-1px); }
    .guess-btn:active { transform: translateY(0); }
    .guess-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    .progress-wrap {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.3s ease, background 0.3s;
      border-radius: 2px;
    }

    .message {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 2px;
      padding: 12px;
      transition: all 0.2s;
    }

    .message.low { color: var(--accent2); border-color: rgba(64,224,240,0.2); background: rgba(64,224,240,0.05); }
    .message.high { color: var(--danger); border-color: rgba(240,64,96,0.2); background: rgba(240,64,96,0.05); }
    .message.win { color: var(--success); border-color: rgba(64,240,128,0.3); background: rgba(64,240,128,0.08); font-size: 14px; }
    .message.lose { color: var(--danger); border-color: rgba(240,64,96,0.3); background: rgba(240,64,96,0.08); }
    .message.hot { color: var(--accent); border-color: rgba(240,224,64,0.3); background: rgba(240,224,64,0.08); }

    .history { margin-top: 16px; }

    .history-label {
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .history-chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      padding: 4px 10px;
      border-radius: 2px;
      font-size: 11px;
      letter-spacing: 1px;
      border: 1px solid;
      animation: chipIn 0.2s ease;
    }

    @keyframes chipIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .chip.low { color: var(--accent2); border-color: rgba(64,224,240,0.3); }
    .chip.high { color: var(--danger); border-color: rgba(240,64,96,0.3); }

    .new-game-btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
    }

    .new-game-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    /* === REYTING TIZIMI DIZAYNI === */
    .leaderboard {
      margin-top: 24px;
      border-top: 1px dashed var(--border);
      padding-top: 16px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      background: rgba(0,0,0,0.2);
      padding: 2px;
      border-radius: 2px;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      padding: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: rgba(255,255,255,0.05);
      color: var(--accent);
    }
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 6px 8px;
      background: rgba(255,255,255,0.01);
      border-radius: 2px;
    }
    .leaderboard-item .name { color: var(--text); flex: 1; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .leaderboard-item .score { color: var(--accent2); font-weight: bold; }
    .leaderboard-item .time-val { color: var(--muted); font-size: 10px; margin-left: 6px; }
    .leaderboard-item .wins-val { color: var(--success); font-weight: bold; }
    .no-records {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 1px;
      padding: 10px 0;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .shake { animation: shake 0.4s ease; }

    @keyframes winPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(64,240,128,0.4); }
      50% { box-shadow: 0 0 20px 8px rgba(64,240,128,0.15); }
    }

    .win-glow { animation: winPulse 1.5s infinite; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title">SANDÍ TAP</div>
    <div class="subtitle" id="subtitle">Sandı boljap kóríń</div>
  </div>

  <div class="lang-row">
    <button class="lang-btn active" onclick="setLang('kaa')">QAR</button>
    <button class="lang-btn" onclick="setLang('uz')">UZB</button>
    <button class="lang-btn" onclick="setLang('ru')">RUS</button>
    <button class="lang-btn" onclick="setLang('en')">ENG</button>
  </div>

  <div class="mode-row">
    <button class="mode-btn active" onclick="setMode('single')" id="mode-single">—</button>
    <button class="mode-btn" onclick="setMode('pvp')" id="mode-pvp">—</button>
  </div>

  <div class="card" id="card">
    <div class="difficulty-row" id="diff-container">
      <button class="diff-btn active" onclick="setDiff('oson')" id="diff-oson">—</button>
      <button class="diff-btn" onclick="setDiff('orta')" id="diff-orta">—</button>
      <button class="diff-btn" onclick="setDiff('qiyin')" id="diff-qiyin">—</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-val" id="attempts-left">10</div>
        <div class="stat-label" id="label-attempts">—</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="guesses-made">0</div>
        <div class="stat-label" id="label-guesses">—</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="wins-count">0</div>
        <div class="stat-label" id="label-wins">—</div>
      </div>
    </div>

    <div class="range-info" id="range-info">
      — <span id="range-text">1 — 100</span>
    </div>

    <div class="input-row">
      <input type="number" class="guess-input" id="guess-input" placeholder="?" min="1" max="100">
      <button class="guess-btn" id="guess-btn" onclick="handleSubmit()">—</button>
    </div>

    <div class="progress-wrap" id="progress-container">
      <div class="progress-bar" id="progress-bar" style="width:100%"></div>
    </div>

    <div class="message" id="message">—</div>

    <div class="history" id="history" style="display:none">
      <div class="history-label" id="label-history">—</div>
      <div class="history-chips" id="chips"></div>
    </div>

    <button class="new-game-btn" onclick="newGame()" id="new-game-btn">↺ —</button>

    <div class="leaderboard" id="leaderboard-section">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('attempts')" id="tab-att">TOP URÍNIS</button>
        <button class="tab-btn" onclick="switchTab('wins')" id="tab-win">TOP JEŃIS</button>
      </div>
      <div class="leaderboard-list" id="leaderboard-list"></div>
    </div>
  </div>
</div>

      closeUp: '▲ Higher! Very close.',
      closeDown: '▼ Lower! Very close.',
      upMsg: '▲ Higher! Enter a bigger number.',
      downMsg: '▼ Lower! Enter a smaller number.',
      noRecords: 'No records yet',
      promptName: '🎉 New Record! Enter your name:',
      tabAtt: 'TOP ATTEMPTS',
      tabWin: 'TOP WINS',
      uTxt: 'tries',
      wTxt: 'wins',
      secTxt: 's'
    }
  };

  const DIFFS = {
    oson: { max: 100, attempts: 10 },
    orta: { max: 200, attempts: 8 },
    qiyin: { max: 500, attempts: 7 }
  };

  let secret, maxAttempts, maxNum, attemptsLeft, gameOver, guesses;
  let startTime, currentTab = 'attempts';
  let wins = parseInt(localStorage.getItem('guess_num_total_wins')) || 0;
  
  let currentDiff = 'oson';
  let currentLang = 'kaa';
  let currentGameMode = 'single';
  let pvpState = 'setup';

  function t() { return T[currentLang]; }

  function setLang(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    const activeBtn = document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`);
    if(activeBtn) activeBtn.classList.add('active');
    applyLang();
  }

  function applyLang() {
    const tr = t();
    document.getElementById('subtitle').textContent = tr.subtitle;
    document.getElementById('mode-single').textContent = tr.modes[0];
    document.getElementById('mode-pvp').textContent = tr.modes[1];

    const diffs = ['oson', 'orta', 'qiyin'];
    diffs.forEach((d, i) => {
      document.getElementById('diff-' + d).textContent = tr.diff[i];
    });

    document.getElementById('label-attempts').textContent = tr.labelAttempts;
    document.getElementById('label-guesses').textContent = tr.labelGuesses;
    document.getElementById('label-wins').textContent = tr.labelWins;
    document.getElementById('range-info').innerHTML = tr.rangePrefix + ' <span id="range-text">1 — ' + maxNum + '</span>';
    document.getElementById('new-game-btn').textContent = tr.newGame;
    document.getElementById('label-history').textContent = tr.historyLabel;
    
    document.getElementById('tab-att').textContent = tr.tabAtt;
    document.getElementById('tab-win').textContent = tr.tabWin;

    updateGuessButtonLabel();

    const input = document.getElementById('guess-input');
    if (currentGameMode === 'pvp' && pvpState === 'setup') {
      input.placeholder = currentLang === 'en' ? 'Secret' : currentLang === 'ru' ? 'Секрет' : currentLang === 'uz' ? 'Yashirin' : 'Jasırın';
    } else {
      input.placeholder = '?';
    }

    if (!gameOver && guesses && guesses.length === 0) {
      if (currentGameMode === 'pvp' && pvpState === 'setup') {
        setMessage(tr.pvpSetupMsg, '');
      } else if (currentGameMode === 'pvp' && pvpState === 'play') {
        setMessage(tr.pvpPlayMsg, '');
      } else {
        setMessage(tr.startMsg, '');
      }
    }
    renderLeaderboard();
  }

  function updateGuessButtonLabel() {
    const btn = document.getElementById('guess-btn');
    if (currentGameMode === 'pvp' && pvpState === 'setup') {
      btn.textContent = t().submitBtn;
    } else {
      btn.textContent = t().guessBtn;
    }
  }

  function setMode(mode) {
    currentGameMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('mode-' + mode).classList.add('active');
    
    if(mode === 'pvp') {
      document.getElementById('diff-container').style.display = 'none';
      document.getElementById('leaderboard-section').style.display = 'none';
    } else {
      document.getElementById('diff-container').style.display = 'flex';
      document.getElementById('leaderboard-section').style.display = 'block';
    }
    newGame();
  }

  function setDiff(d) {
    currentDiff = d;
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('diff-' + d).classList.add('active');
    newGame();
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tab-att').classList.toggle('active', tab === 'attempts');
    document.getElementById('tab-win').classList.toggle('active', tab === 'wins');
    renderLeaderboard();
  }

  function newGame() {
    const cfg = DIFFS[currentDiff];
    maxNum = currentGameMode === 'pvp' ? 100 : cfg.max;
    maxAttempts = currentGameMode === 'pvp' ? 10 : cfg.attempts;
    attemptsLeft = maxAttempts;
    gameOver = false;
    guesses = [];
    startTime = Date.now(); // O'yin boshlangan vaqt

    document.getElementById('range-info').innerHTML = t().rangePrefix + ' <span id="range-text">1 — ' + maxNum + '</span>';
    document.getElementById('attempts-left').textContent = attemptsLeft;
    document.getElementById('guesses-made').textContent = 0;
    document.getElementById('wins-count').textContent = wins;

    const input = document.getElementById('guess-input');
    input.max = maxNum;
    input.disabled = false;
    input.value = '';
    
    document.getElementById('guess-btn').disabled = false;
    document.getElementById('progress-bar').style.width = '100%';
    document.getElementById('progress-bar').style.background = 'linear-gradient(90deg, var(--accent), var(--accent2))';
    document.getElementById('progress-container').style.opacity = currentGameMode === 'pvp' ? '0' : '1';

    document.getElementById('history').style.display = 'none';
    document.getElementById('chips').innerHTML = '';
    document.getElementById('card').classList.remove('win-glow');

    if (currentGameMode === 'pvp') {
      pvpState = 'setup';
      input.placeholder = currentLang === 'en' ? 'Secret' : currentLang === 'ru' ? 'Секрет' : currentLang === 'uz' ? 'Yashirin' : 'Jasırın';
      input.type = 'password';
      setMessage(t().pvpSetupMsg, '');
    } else {
      secret = Math.floor(Math.random() * maxNum) + 1;
      input.placeholder = '?';
      input.type = 'number';
      setMessage(t().startMsg, '');
    }

    updateGuessButtonLabel();
    renderLeaderboard();
  }

  function handleSubmit() {
    if (currentGameMode === 'pvp' && pvpState === 'setup') {
      handlePvPSetup();
    } else {
      makeGuess();
    }
  }

  function handlePvPSetup() {
    const input = document.getElementById('guess-input');
    const val = parseInt(input.value);

    if (!val || val < 1 || val > maxNum) {
      input.classList.add('shake');
      setTimeout(() => input.classList.remove('shake'), 400);
      setMessage(t().invalidMsg(maxNum), 'high');
      return;
    }

    secret = val;
    pvpState = 'play';
    input.value = '';
    input.placeholder = '?';
    input.type = 'number';
    document.getElementById('progress-container').style.opacity = '1';
    setMessage(t().pvpPlayMsg, '');
    updateGuessButtonLabel();
    startTime = Date.now(); // PvP rejimida taxmin boshlanganda vaqtni hisoblash
  }

  function makeGuess() {
    if (gameOver) return;
    const input = document.getElementById('guess-input');
    const val = parseInt(input.value);

    if (!val || val < 1 || val > maxNum) {
      input.classList.add('shake');
      setTimeout(() => input.classList.remove('shake'), 400);
      setMessage(t().invalidMsg(maxNum), 'high');
      return;
    }

    if (guesses.includes(val)) {
      input.classList.add('shake');
      setTimeout(() => input.classList.remove('shake'), 400);
      setMessage(t().alreadyMsg, '');
      return;
    }

    attemptsLeft--;
    guesses.push(val);

    document.getElementById('guesses-made').textContent = guesses.length;
    document.getElementById('attempts-left').textContent = attemptsLeft;

    const pct = (attemptsLeft / maxAttempts) * 100;
    const bar = document.getElementById('progress-bar');
    bar.style.width = pct + '%';
    if (pct < 30) bar.style.background = 'var(--danger)';
    else if (pct < 60) bar.style.background = 'linear-gradient(90deg, var(--accent), orange)';
    else bar.style.background = 'linear-gradient(90deg, var(--accent), var(--accent2))';

    addChip(val);
    input.value = '';

    if (val === secret) {
      const totalTime = Math.round((Date.now() - startTime) / 1000); // Sarflangan vaqt (sekund)
      wins++;
      localStorage.setItem('guess_num_total_wins', wins);
      document.getElementById('wins-count').textContent = wins;
      setMessage(t().winMsg(secret, guesses.length), 'win');
      document.getElementById('guess-btn').disabled = true;
      input.disabled = true;
      document.getElementById('card').classList.add('win-glow');
      gameOver = true;
      
      if (currentGameMode === 'single') {
        saveLeaderboards(guesses.length, totalTime);
      }
      return;
    }

    if (attemptsLeft === 0) {
      setMessage(t().loseMsg(secret), 'lose');
      document.getElementById('guess-btn').disabled = true;
      input.disabled = true;
      gameOver = true;
      return;
    }

    const diff = Math.abs(val - secret);
    const pctRange = diff / maxNum;

    if (val < secret) {
      if (pctRange < 0.05) setMessage(t().hotUp, 'hot');
      else if (pctRange < 0.15) setMessage(t().closeUp, 'low');
      else setMessage(t().upMsg, 'low');
    } else {
      if (pctRange < 0.05) setMessage(t().hotDown, 'hot');
      else if (pctRange < 0.15) setMessage(t().closeDown, 'high');
      else setMessage(t().downMsg, 'high');
    }
  }

  function addChip(val) {
    const chips = document.getElementById('chips');
    const chip = document.createElement('div');
    chip.className = 'chip ' + (val < secret ? 'low' : val > secret ? 'high' : 'win');
    chip.textContent = val + (val < secret ? ' ↑' : val > secret ? ' ↓' : ' ✓');
    chips.appendChild(chip);
    document.getElementById('history').style.display = 'block';
  }

  function setMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.className = 'message ' + type;
  }

  function saveLeaderboards(score, time) {
    setTimeout(() => {
      let name = prompt(t().promptName);
      if (!name || name.trim() === "") name = "Anonymous";
      name = name.substring(0, 15);

      const diffKey = currentDiff;

      // 1. Urinishlar & Vaqt Reytingini Saqlash
      let attKey = 'guess_num_att_records_' + diffKey;
      let attRecords = JSON.parse(localStorage.getItem(attKey)) || [];
      attRecords.push({ name: name, score: score, time: time });
      // Avval urinish soni bo'yicha, u teng bo'lsa vaqt bo'yicha saralash (kichik bo'lsa shuncha yaxshi)
      attRecords.sort((a, b) => a.score - b.score || a.time - b.time);
      attRecords = attRecords.slice(0, 10);
      localStorage.setItem(attKey, JSON.stringify(attRecords));

      // 2. Jami G'alabalar Reytingini Saqlash
      let winKey = 'guess_num_win_records_' + diffKey;
      let winRecords = JSON.parse(localStorage.getItem(winKey)) || [];
      let player = winRecords.find(r => r.name.toLowerCase() === name.toLowerCase());
      if (player) {
        player.wins = (player.wins || 1) + 1;
      } else {
        winRecords.push({ name: name, wins: 1 });
      }
      // G'alabalar soni bo'yicha saralash (katta bo'lsa yuqorida turadi)
      winRecords.sort((a, b) => b.wins - a.wins);
      winRecords = winRecords.slice(0, 10);
      localStorage.setItem(winKey, JSON.stringify(winRecords));

      renderLeaderboard();
    }, 500);
  }

  function renderLeaderboard() {
    if (currentGameMode === 'pvp') return;
    const container = document.getElementById('leaderboard-list');
    container.innerHTML = '';

    let key = 'guess_num_' + (currentTab === 'attempts' ? 'att_records_' : 'win_records_') + currentDiff;
    let records = JSON.parse(localStorage.getItem(key)) || [];

    if (records.length === 0) {
      container.innerHTML = `<div class="no-records">${t().noRecords}</div>`;
      return;
    }

    records.forEach((r, index) => {
      const item = document.createElement('div');
      item.className = 'leaderboard-item';
      
      if (currentTab === 'attempts') {
        item.innerHTML = `
          <span class="name">${index + 1}. ${r.name}</span>
          <div>
            <span class="score">${r.score} ${t().uTxt}</span>
            <span class="time-val">${r.time}${t().secTxt}</span>
          </div>
        `;
      } else {
        item.innerHTML = `
          <span class="name">${index + 1}. ${r.name}</span>
          <span class="wins-val">${r.wins} ${t().wTxt}</span>
        `;
      }
      container.appendChild(item);
    });
  }

  document.getElementById('guess-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleSubmit();
    }
  });

  applyLang();
  newGame();
</script>
</body>
</html>
